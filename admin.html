<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Base Outdoor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{
    --pine:#131f17; --forest:#1e3225; --orange:#e35f21; --orange-2:#ff7a3d;
    --olive:#8a9a5b; --cream:#f3ede0; --paper:#faf7ee; --ink:#12160f;
    --mist:#c9d3bf; --line:rgba(243,237,224,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:15px; line-height:1.6; min-height:100vh; }
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.03em;}
  h1,h2,h3{font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.01em;}
  a{color:inherit;} button{font-family:inherit; cursor:pointer;}

  /* Gate */
  #gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 90% at 20% 0%,#1a2c1f 0%,var(--pine) 55%,#0d1610 100%); color:var(--paper); padding:24px; }
  #gate .box{max-width:360px; width:100%; text-align:center;}
  #gate h1{font-size:28px; margin-bottom:8px;}
  #gate p{color:var(--mist); font-size:14px; margin-bottom:26px;}
  #gate input{ width:100%; padding:13px 14px; border-radius:3px; border:1px solid rgba(243,237,224,0.25); background:rgba(255,255,255,0.06); color:var(--paper); font-size:15px; margin-bottom:14px; }
  #gate input:focus{outline:none; border-color:var(--orange);}
  #gate button{ width:100%; padding:13px; border:0; border-radius:3px; background:var(--orange); color:var(--pine); font-weight:600; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; }
  #gate button:hover{background:var(--orange-2);}
  #gate .err{color:var(--orange-2); font-size:13px; margin-top:14px; min-height:16px;}

  /* App */
  #app{display:none;}
  header{ background:var(--pine); color:var(--paper); padding:18px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  header .brand{font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;}
  header .brand span{color:var(--orange);}
  .logout{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--mist); border:1px solid var(--line); padding:8px 14px; border-radius:2px; background:none; }
  .logout:hover{color:var(--paper); border-color:var(--orange);}

  /* Tabs */
  .tabs{ background:var(--forest); border-bottom:1px solid var(--line); display:flex; padding:0 28px; }
  .tab-btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.07em; text-transform:uppercase; padding:16px 22px; border:0; background:none; color:var(--mist); cursor:pointer; position:relative; transition:color .2s; }
  .tab-btn::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--orange); transform:scaleX(0); transition:transform .2s; }
  .tab-btn.active{ color:var(--paper); }
  .tab-btn.active::after{ transform:scaleX(1); }
  .tab-panel{display:none;} .tab-panel.active{display:block;}

  main{max-width:1300px; margin:0 auto; padding:28px;}

  /* Layout lista+detalhe */
  .layout{ display:grid; grid-template-columns:300px 1fr; gap:0; background:var(--forest); border:1px solid var(--line); border-radius:6px; overflow:hidden; min-height:600px; }
  .list-wrap{ border-right:1px solid var(--line); max-height:80vh; overflow-y:auto; }
  .list-header{ padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .list-header span{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--mist); }
  .list-empty{padding:26px 22px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#7c8f77;}
  ul.item-list{list-style:none;}
  .list-item{ padding:14px 20px; border-bottom:1px solid var(--line); cursor:pointer; position:relative; transition:background .2s; }
  .list-item::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--orange); transform:scaleX(0); transition:transform .2s; }
  .list-item:hover{background:rgba(227,95,33,0.06);}
  .list-item.active{background:rgba(227,95,33,0.1);}
  .list-item.active::before{transform:scaleX(1);}
  .list-item .iname{ font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:var(--paper); }
  .list-item .imeta{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--mist); margin-top:4px; }
  .pill{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; padding:3px 8px; border-radius:20px; margin-top:5px; }
  .pill-pendente{background:rgba(227,95,33,0.18); color:var(--orange-2);}
  .pill-aprovado,.pill-ativo{background:rgba(138,154,91,0.2); color:var(--olive);}
  .pill-rejeitado,.pill-inativo{background:rgba(201,211,191,0.12); color:var(--mist);}

  /* Detalhe / formulários */
  .detail{padding:28px 32px; overflow-y:auto; max-height:80vh;}
  .detail-empty{ height:100%; display:flex; align-items:center; justify-content:center; color:#7c8f77; font-family:'IBM Plex Mono',monospace; font-size:13px; min-height:500px; text-align:center; padding:20px; }
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .detail-head h2{font-size:24px; color:var(--paper);}
  .submitter{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--mist); margin-bottom:20px;}
  .submitter a{color:var(--orange-2);}

  #admin-map{ position:relative; height:300px; border-radius:4px; overflow:hidden; background:var(--pine); margin-bottom:20px; }
  #admin-map-el{position:absolute; inset:0; width:100%; height:100%;}
  .map-msg{ position:absolute; left:0; right:0; bottom:0; z-index:600; padding:10px 16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper); background:linear-gradient(to top,rgba(10,17,12,.9),rgba(10,17,12,0)); }
  .stats-row{display:flex; gap:22px; margin-bottom:20px; flex-wrap:wrap;}
  .stats-row div{display:flex; flex-direction:column; gap:3px;}
  .stats-row .val{font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--paper);}
  .stats-row .lbl{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--olive);}

  .edit-form{background:var(--paper); border-radius:6px; padding:24px;}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink);}
  .field input,.field select,.field textarea{ font-family:'Work Sans',sans-serif; font-size:14px; color:var(--ink); background:#fff; border:1px solid #d8d0ba; border-radius:3px; padding:9px 12px; width:100%; }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--orange);}
  .field textarea{resize:vertical;}
  .range-row{display:flex; align-items:center; gap:12px;}
  .range-row input[type="range"]{flex:1;}
  .range-val{font-family:'IBM Plex Mono',monospace; font-size:13px; width:34px; text-align:right;}

  .action-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; align-items:center;}
  .btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; padding:11px 20px; border-radius:2px; border:1px solid transparent; transition:transform .15s,background .2s; }
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn-primary{background:var(--orange); color:var(--pine); font-weight:600;}
  .btn-primary:hover:not(:disabled){background:var(--orange-2); transform:translateY(-1px);}
  .btn-danger{background:none; border-color:#c94b3f; color:#c94b3f;}
  .btn-danger:hover:not(:disabled){background:#c94b3f; color:#fff;}
  .btn-ghost{background:none; border-color:var(--line); color:var(--mist);}
  .btn-ghost:hover:not(:disabled){border-color:var(--orange); color:var(--paper);}
  .btn-warn{background:none; border-color:#b8860b; color:#b8860b;}
  .btn-warn:hover:not(:disabled){background:#b8860b; color:#fff;}
  .action-status{font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .action-status.ok{color:#4b7a3d;}
  .action-status.err{color:var(--orange);}

  /* Catálogo: botão nova rota */
  .catalog-toolbar{ padding:14px 20px; border-bottom:1px solid var(--line); }
  .route-inactive .iname{ opacity:0.5; }

  @media(max-width:820px){
    .layout{grid-template-columns:1fr;}
    .list-wrap{border-right:0; border-bottom:1px solid var(--line); max-height:260px;}
    .form-row{grid-template-columns:1fr;}
    .detail{padding:20px 16px;}
  }
</style>
</head>
<body>

<!-- Gate -->
<div id="gate">
  <div class="box">
    <h1>Base Outdoor</h1>
    <p class="mono">Área de administração</p>
    <input type="password" id="gate-password" placeholder="Password de administrador" autocomplete="current-password">
    <button id="gate-submit">Entrar</button>
    <p class="err mono" id="gate-error"></p>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="brand">BASE OUTDOOR <span>ADMIN</span></div>
    <button class="logout" id="logout-btn">Sair</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="submissions">Submissões</button>
    <button class="tab-btn" data-tab="catalog">Catálogo</button>
  </div>

  <!-- ===== TAB: SUBMISSÕES ===== -->
  <div class="tab-panel active" id="tab-submissions">
    <main>
      <div class="layout">
        <div class="list-wrap">
          <div class="list-header">
            <span>Submissões</span>
            <label class="mono" style="font-size:11px; display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--mist);">
              <input type="checkbox" id="toggle-all"> todas
            </label>
          </div>
          <ul class="item-list" id="sub-list"></ul>
          <p class="list-empty" id="sub-empty" hidden>Sem submissões pendentes 🎉</p>
        </div>
        <div class="detail" id="sub-detail">
          <div class="detail-empty">Seleciona uma submissão à esquerda para reveres o traçado.</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== TAB: CATÁLOGO ===== -->
  <div class="tab-panel" id="tab-catalog">
    <main>
      <div class="layout">
        <div class="list-wrap">
          <div class="catalog-toolbar">
            <button class="btn btn-primary" id="btn-new-route" style="width:100%;">+ Nova rota</button>
          </div>
          <ul class="item-list" id="cat-list"></ul>
          <p class="list-empty" id="cat-empty" hidden>Ainda não há rotas publicadas.</p>
        </div>
        <div class="detail" id="cat-detail">
          <div class="detail-empty">Seleciona uma rota à esquerda para editares, ou clica em "Nova rota".</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API = {
  subList:   '/.netlify/functions/admin-list-submissions',
  subGet:    '/.netlify/functions/admin-get-submission',
  approve:   '/.netlify/functions/admin-approve-submission',
  reject:    '/.netlify/functions/admin-reject-submission',
  catList:   '/.netlify/functions/admin-list-routes',
  saveRoute: '/.netlify/functions/admin-save-route',
  toggle:    '/.netlify/functions/admin-toggle-route',
};

let adminPassword = sessionStorage.getItem('baseOutdoorAdminPw') || '';

function withAuth(url){
  const u = new URL(url, location.origin);
  u.searchParams.set('pw', adminPassword);
  return u.toString();
}

// ---- Gate ----
const gate = document.getElementById('gate');
const app  = document.getElementById('app');
const gatePwInput = document.getElementById('gate-password');
const gateError   = document.getElementById('gate-error');

async function tryEnter(pw){
  gateError.textContent = '';
  try {
    const u = new URL(API.subList, location.origin); u.searchParams.set('pw', pw);
    const res = await fetch(u.toString());
    if (res.status === 401){ gateError.textContent = 'Password incorreta.'; return; }
    if (!res.ok){ gateError.textContent = 'Erro ao ligar (' + res.status + ').'; return; }
    adminPassword = pw;
    sessionStorage.setItem('baseOutdoorAdminPw', pw);
    gate.style.display = 'none';
    app.style.display  = 'block';
    loadSubmissions();
    loadCatalog();
  } catch (err){
    gateError.textContent = 'Não foi possível ligar ao servidor.';
  }
}

document.getElementById('gate-submit').addEventListener('click', () => tryEnter(gatePwInput.value));
gatePwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(gatePwInput.value); });
document.getElementById('logout-btn').addEventListener('click', () => { sessionStorage.removeItem('baseOutdoorAdminPw'); location.reload(); });
if (adminPassword) tryEnter(adminPassword);

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- Helpers ----
function escHtml(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function haversineM(lat1,lon1,lat2,lon2){
  const R=6371000, r=d=>d*Math.PI/180;
  const a=Math.sin(r(lat2-lat1)/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lon2-lon1)/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function computeStats(pts){
  let d=0,g=0;
  for(let i=1;i<pts.length;i++){
    d+=haversineM(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
    if(pts[i].ele!=null&&pts[i-1].ele!=null&&pts[i].ele>pts[i-1].ele) g+=pts[i].ele-pts[i-1].ele;
  }
  return {distanceKm:d/1000, elevationGain:Math.round(g)};
}
function extractPoints(xml){
  let nodes=[...xml.querySelectorAll('trkpt,rtept')];
  if(!nodes.length) for(const ns of['http://www.topografix.com/GPX/1/1','http://www.topografix.com/GPX/1/0']){
    const t=[...xml.getElementsByTagNameNS(ns,'trkpt')], r=[...xml.getElementsByTagNameNS(ns,'rtept')];
    if(t.length||r.length){nodes=[...t,...r];break;}
  }
  if(!nodes.length) nodes=[...xml.getElementsByTagName('*')].filter(e=>e.localName==='trkpt'||e.localName==='rtept');
  return nodes.map(p=>{
    const e=[...p.getElementsByTagName('*')].find(c=>c.localName==='ele');
    return {lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon'),ele:e?+e.textContent:null};
  }).filter(p=>!isNaN(p.lat)&&!isNaN(p.lon));
}

// Shared Leaflet map instance
let leafletMap=null, trackLayer=null;

function getMap(elId){
  const el = document.getElementById(elId);
  if(!el) return null;
  if(!leafletMap){
    leafletMap = L.map(elId, {zoomControl:true, scrollWheelZoom:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
  } else {
    // Move the map container to the new parent element
    el.appendChild(leafletMap.getContainer());
    leafletMap.invalidateSize();
  }
  return leafletMap;
}

function renderTrack(points, mapElId, msgElId){
  const map = getMap(mapElId);
  const msgEl = document.getElementById(msgElId);
  if(!map) return;
  if(trackLayer){map.removeLayer(trackLayer); trackLayer=null;}
  if(msgEl) msgEl.hidden = true;
  if(points.length < 2){
    map.setView([40.25,-7.55],11);
    if(msgEl){msgEl.hidden=false; msgEl.textContent='Sem pontos de traçado neste GPX.';}
    setTimeout(()=>map.invalidateSize(),60);
    return;
  }
  const lls = points.map(p=>[p.lat,p.lon]);
  trackLayer = L.polyline(lls,{color:'#ff7a3d',weight:4,opacity:.95}).addTo(map);
  const si = L.divIcon({className:'',html:'<div style="width:10px;height:10px;border-radius:50%;background:#8a9a5b;border:2px solid #fff;"></div>',iconSize:[10,10]});
  const ei = L.divIcon({className:'',html:'<div style="width:10px;height:10px;border-radius:50%;background:#ff7a3d;border:2px solid #fff;"></div>',iconSize:[10,10]});
  L.marker(lls[0],{icon:si}).addTo(map);
  L.marker(lls[lls.length-1],{icon:ei}).addTo(map);
  setTimeout(()=>{map.invalidateSize(); map.fitBounds(trackLayer.getBounds(),{padding:[20,20]});},60);
}

// =============================================
// ===== TAB: SUBMISSÕES =======================
// =============================================
let submissions = [], activeSubKey = null, subReplacementFile = null;

async function loadSubmissions(){
  document.getElementById('sub-list').innerHTML = '';
  const showAll = document.getElementById('toggle-all').checked;
  try {
    const res = await fetch(withAuth(API.subList + (showAll ? '?all=1' : '')));
    if(res.status===401){sessionStorage.removeItem('baseOutdoorAdminPw');location.reload();return;}
    const data = await res.json();
    submissions = data.submissions || [];
    renderSubList();
  } catch(err){ console.error(err); }
}
document.getElementById('toggle-all').addEventListener('change', loadSubmissions);

function renderSubList(){
  const ul = document.getElementById('sub-list');
  const empty = document.getElementById('sub-empty');
  ul.innerHTML = '';
  empty.hidden = submissions.length !== 0;
  submissions.forEach(s => {
    const li = document.createElement('li');
    li.className = 'list-item' + (s.key === activeSubKey ? ' active' : '');
    li.dataset.key = s.key;
    const date = s.submittedAt ? new Date(s.submittedAt).toLocaleDateString('pt-PT') : '';
    li.innerHTML = `<span class="iname">${escHtml(s.nomeRota||'(sem nome)')}</span><span class="imeta">${escHtml(s.nome||'?')} · ${date}</span><span class="pill pill-${s.status||'pendente'}">${s.status||'pendente'}</span>`;
    li.addEventListener('click', () => openSubmission(s.key));
    ul.appendChild(li);
  });
}

async function openSubmission(key){
  activeSubKey = key; subReplacementFile = null;
  renderSubList();
  const detail = document.getElementById('sub-detail');
  detail.innerHTML = '<div class="detail-empty">A carregar…</div>';
  try {
    const res = await fetch(withAuth(API.subGet + '?key=' + encodeURIComponent(key)));
    const data = await res.json();
    if(!data.ok) throw new Error(data.error);
    renderSubDetail(data.key, data.info, data.gpx);
  } catch(err){ detail.innerHTML = `<div class="detail-empty">Erro: ${escHtml(err.message)}</div>`; }
}

function renderSubDetail(key, info, gpxText){
  const detail = document.getElementById('sub-detail');
  detail.innerHTML = `
    <div class="detail-head"><h2>${escHtml(info.nomeRota||'Rota')}</h2></div>
    <p class="submitter">Por ${escHtml(info.nome||'?')} · <a href="mailto:${escHtml(info.email||'')}">${escHtml(info.email||'')}</a>
      ${info.submittedAt?' · '+new Date(info.submittedAt).toLocaleString('pt-PT'):''}
      · estado: <strong>${escHtml(info.status||'pendente')}</strong>
    </p>
    <div id="admin-map"><div id="admin-map-el"></div><div class="map-msg" id="admin-map-msg" hidden></div></div>
    <div class="stats-row">
      <div><span class="val" id="stat-dist">—</span><span class="lbl">distância</span></div>
      <div><span class="val" id="stat-elev">—</span><span class="lbl">D+</span></div>
      <div><span class="val" id="stat-pts">—</span><span class="lbl">pontos</span></div>
    </div>
    <div class="edit-form">
      <div class="form-row">
        <div class="field"><label>Nome da rota</label><input id="sf-name" value="${escHtml(info.nomeRota||'')}"></div>
        <div class="field"><label>Categoria</label>
          <select id="sf-cat"><option value="btt">BTT</option><option value="estrada">Estrada</option><option value="trail">Trail</option><option value="cross">Cross</option></select>
        </div>
      </div>
      <div class="field"><label>Descrição pública</label><textarea id="sf-desc" rows="3">${escHtml(info.notas||'')}</textarea></div>
      <div class="form-row">
        <div class="field"><label>Distância</label><input id="sf-dist" placeholder="ex: 32.4 km"></div>
        <div class="field"><label>D+</label><input id="sf-elev" placeholder="ex: 640 m"></div>
      </div>
      <div class="field"><label>Dificuldade</label>
        <div class="range-row"><input type="range" id="sf-diff" min="0" max="100" value="50"><span class="range-val" id="sf-diff-val">50</span></div>
      </div>
      <div class="field"><label>Substituir GPX <span style="text-transform:none;color:#9a9584;">(opcional)</span></label>
        <input type="file" id="sf-gpx" accept=".gpx">
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="sf-approve">Aprovar e publicar</button>
        <button class="btn btn-danger" id="sf-reject">Rejeitar</button>
        <span class="action-status" id="sf-status"></span>
      </div>
    </div>`;

  document.getElementById('sf-cat').value = info.categoria || 'btt';
  document.getElementById('sf-diff').addEventListener('input', e => document.getElementById('sf-diff-val').textContent = e.target.value);
  document.getElementById('sf-gpx').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    subReplacementFile = f;
    const reader = new FileReader();
    reader.onload = () => updateSubMap(reader.result);
    reader.readAsText(f);
  });
  document.getElementById('sf-approve').addEventListener('click', () => submitSubDecision(key, 'approve'));
  document.getElementById('sf-reject').addEventListener('click',  () => submitSubDecision(key, 'reject'));

  updateSubMap(gpxText);
}

function updateSubMap(gpxText){
  let pts = [];
  try { const xml=new DOMParser().parseFromString(gpxText,'application/xml'); if(!xml.querySelector('parsererror')) pts=extractPoints(xml); } catch{}
  renderTrack(pts, 'admin-map-el', 'admin-map-msg');
  const s = pts.length>=2 ? computeStats(pts) : null;
  document.getElementById('stat-dist').textContent = s ? s.distanceKm.toFixed(1)+' km' : '—';
  document.getElementById('stat-elev').textContent = s ? s.elevationGain+' m' : '—';
  document.getElementById('stat-pts').textContent  = pts.length || '0';
  if(s){
    const d=document.getElementById('sf-dist'), e=document.getElementById('sf-elev');
    if(!d.value) d.value = s.distanceKm.toFixed(1)+' km';
    if(!e.value) e.value = s.elevationGain+' m';
  }
}

async function submitSubDecision(key, action){
  const statusEl = document.getElementById('sf-status');
  const approveBtn = document.getElementById('sf-approve');
  const rejectBtn  = document.getElementById('sf-reject');
  statusEl.className = 'action-status'; statusEl.textContent = 'A processar…';
  approveBtn.disabled = rejectBtn.disabled = true;

  try {
    if(action === 'reject'){
      if(!confirm('Rejeitar esta submissão?')) throw new Error('cancelado');
      const res = await fetch(withAuth(API.reject), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key})});
      const d = await res.json();
      if(!res.ok||!d.ok) throw new Error(d.error||'erro');
      statusEl.className='action-status ok'; statusEl.textContent='Rejeitada.';
      await loadSubmissions();
      document.getElementById('sub-detail').innerHTML='<div class="detail-empty">Seleciona uma submissão.</div>';
    } else {
      const name = document.getElementById('sf-name').value.trim();
      if(!name){ statusEl.className='action-status err'; statusEl.textContent='Nome obrigatório.'; approveBtn.disabled=rejectBtn.disabled=false; return; }
      const form = new FormData();
      form.set('key', key);
      form.set('name', name);
      form.set('category', document.getElementById('sf-cat').value);
      form.set('description', document.getElementById('sf-desc').value.trim());
      form.set('distance', document.getElementById('sf-dist').value.trim());
      form.set('elevation', document.getElementById('sf-elev').value.trim());
      form.set('diff', document.getElementById('sf-diff').value);
      if(subReplacementFile) form.set('gpxFile', subReplacementFile);
      const res = await fetch(withAuth(API.approve), {method:'POST', body:form});
      const d = await res.json();
      if(!res.ok||!d.ok) throw new Error(d.error||'erro');
      statusEl.className='action-status ok'; statusEl.textContent='Publicada! Já aparece no site.';
      await loadSubmissions(); await loadCatalog();
      document.getElementById('sub-detail').innerHTML='<div class="detail-empty">Seleciona uma submissão.</div>';
    }
  } catch(err){
    if(err.message !== 'cancelado'){ statusEl.className='action-status err'; statusEl.textContent='Falhou: '+err.message; }
    approveBtn.disabled = rejectBtn.disabled = false;
  }
}

// =============================================
// ===== TAB: CATÁLOGO =========================
// =============================================
let catalogRoutes = [], activeCatId = null, catGpxFile = null;

async function loadCatalog(){
  document.getElementById('cat-list').innerHTML = '';
  try {
    const res = await fetch(withAuth(API.catList));
    if(res.status===401){sessionStorage.removeItem('baseOutdoorAdminPw');location.reload();return;}
    const data = await res.json();
    catalogRoutes = data.routes || [];
    renderCatalogList();
  } catch(err){ console.error(err); }
}

function renderCatalogList(){
  const ul = document.getElementById('cat-list');
  const empty = document.getElementById('cat-empty');
  ul.innerHTML = '';
  empty.hidden = catalogRoutes.length !== 0;
  catalogRoutes.forEach(r => {
    const li = document.createElement('li');
    const isActive = r.active !== false;
    li.className = 'list-item' + (r.id === activeCatId ? ' active' : '') + (isActive ? '' : ' route-inactive');
    li.dataset.id = r.id;
    li.innerHTML = `<span class="iname">${escHtml(r.name||r.id)}</span><span class="imeta">${escHtml(r.typeLabel||r.category||'')} · ${escHtml(r.distance||'—')}</span><span class="pill ${isActive?'pill-ativo':'pill-inativo'}">${isActive?'ativo':'inativo'}</span>`;
    li.addEventListener('click', () => openCatalogRoute(r.id));
    ul.appendChild(li);
  });
}

document.getElementById('btn-new-route').addEventListener('click', () => openCatalogRoute(null));

function openCatalogRoute(id){
  activeCatId = id; catGpxFile = null;
  renderCatalogList();
  const route = id ? catalogRoutes.find(r => r.id === id) : null;
  renderCatalogDetail(route);
}

function renderCatalogDetail(route){
  const detail = document.getElementById('cat-detail');
  const isNew = !route;
  const isActive = route ? route.active !== false : true;

  detail.innerHTML = `
    <div class="detail-head">
      <h2>${isNew ? 'Nova rota' : escHtml(route.name||route.id)}</h2>
      ${!isNew ? `<div class="action-row">
        <button class="btn ${isActive?'btn-warn':'btn-ghost'}" id="btn-toggle">${isActive?'Desativar':'Reativar'}</button>
      </div>` : ''}
    </div>
    ${!isNew && route.publishedAt ? `<p class="submitter">Publicada em ${new Date(route.publishedAt).toLocaleString('pt-PT')}${route.submittedBy?' · por '+escHtml(route.submittedBy):''}</p>` : ''}

    ${!isNew ? `<div id="admin-map"><div id="admin-map-el"></div><div class="map-msg" id="admin-map-msg" hidden></div></div>
    <div class="stats-row">
      <div><span class="val" id="stat-dist">${escHtml(route.distance||'—')}</span><span class="lbl">distância</span></div>
      <div><span class="val" id="stat-elev">${escHtml(route.elevation||'—')}</span><span class="lbl">D+</span></div>
    </div>` : ''}

    <div class="edit-form">
      <div class="form-row">
        <div class="field"><label>Nome da rota</label><input id="cf-name" value="${escHtml(route?.name||'')}"></div>
        <div class="field"><label>Categoria</label>
          <select id="cf-cat"><option value="btt">BTT</option><option value="estrada">Estrada</option><option value="trail">Trail</option><option value="cross">Cross</option></select>
        </div>
      </div>
      <div class="field"><label>Descrição pública</label><textarea id="cf-desc" rows="3">${escHtml(route?.description||'')}</textarea></div>
      <div class="form-row">
        <div class="field"><label>Distância</label><input id="cf-dist" value="${escHtml(route?.distance||'')}" placeholder="ex: 32.4 km"></div>
        <div class="field"><label>D+</label><input id="cf-elev" value="${escHtml(route?.elevation||'')}" placeholder="ex: 640 m"></div>
      </div>
      <div class="field"><label>Nota de estado</label><input id="cf-status" value="${escHtml(route?.status||'')}" placeholder="ex: Raid histórico · aldeia serrana"></div>
      <div class="field"><label>Dificuldade</label>
        <div class="range-row"><input type="range" id="cf-diff" min="0" max="100" value="${route?.diff||50}"><span class="range-val" id="cf-diff-val">${route?.diff||50}</span></div>
      </div>
      <div class="field"><label>${isNew?'Ficheiro GPX':'Substituir GPX'} ${isNew?'':'<span style="text-transform:none;color:#9a9584;">(opcional)</span>'}</label>
        <input type="file" id="cf-gpx" accept=".gpx">
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="cf-save">${isNew?'Publicar rota':'Guardar alterações'}</button>
        <span class="action-status" id="cf-status-msg"></span>
      </div>
    </div>`;

  const catSel = document.getElementById('cf-cat');
  if(route?.category) catSel.value = route.category;
  document.getElementById('cf-diff').addEventListener('input', e => document.getElementById('cf-diff-val').textContent = e.target.value);
  document.getElementById('cf-gpx').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    catGpxFile = f;
    if(!isNew){
      const reader = new FileReader();
      reader.onload = () => { try { const xml=new DOMParser().parseFromString(reader.result,'application/xml'); renderTrack(extractPoints(xml),'admin-map-el','admin-map-msg'); } catch{} };
      reader.readAsText(f);
    }
  });
  document.getElementById('cf-save').addEventListener('click', () => saveCatalogRoute(route?.id || null));

  if(!isNew){
    // Botão toggle
    document.getElementById('btn-toggle').addEventListener('click', () => toggleRoute(route.id, isActive));
    // Carrega o mapa com o GPX existente
    fetch(withAuth(`/.netlify/functions/admin-get-submission?key=${encodeURIComponent(route.id)}`))
      .catch(() => {})
      .then(async res => {
        if(!res || !res.ok) return;
        const d = await res.json();
        if(d.gpx){ try { const xml=new DOMParser().parseFromString(d.gpx,'application/xml'); renderTrack(extractPoints(xml),'admin-map-el','admin-map-msg'); } catch{} }
      });
    // Alternativa: usar o endpoint público do GPX
    const gpxUrl = `/.netlify/functions/get-published-gpx?id=${encodeURIComponent(route.id)}`;
    fetch(gpxUrl).then(async r => {
      if(!r.ok) return;
      const txt = await r.text();
      try { const xml=new DOMParser().parseFromString(txt,'application/xml'); renderTrack(extractPoints(xml),'admin-map-el','admin-map-msg'); } catch{}
    }).catch(()=>{});
  }
}

async function saveCatalogRoute(existingId){
  const statusEl = document.getElementById('cf-status-msg');
  const saveBtn  = document.getElementById('cf-save');
  statusEl.className='action-status'; statusEl.textContent='A guardar…';
  saveBtn.disabled = true;

  const name = document.getElementById('cf-name').value.trim();
  if(!name){ statusEl.className='action-status err'; statusEl.textContent='Nome obrigatório.'; saveBtn.disabled=false; return; }
  if(!existingId && !catGpxFile){ statusEl.className='action-status err'; statusEl.textContent='GPX obrigatório para novas rotas.'; saveBtn.disabled=false; return; }

  const form = new FormData();
  if(existingId) form.set('id', existingId);
  form.set('name', name);
  form.set('category', document.getElementById('cf-cat').value);
  form.set('description', document.getElementById('cf-desc').value.trim());
  form.set('distance', document.getElementById('cf-dist').value.trim());
  form.set('elevation', document.getElementById('cf-elev').value.trim());
  form.set('status', document.getElementById('cf-status').value.trim());
  form.set('diff', document.getElementById('cf-diff').value);
  if(catGpxFile) form.set('gpx', catGpxFile);

  try {
    const res = await fetch(withAuth(API.saveRoute), {method:'POST', body:form});
    const d = await res.json();
    if(!res.ok||!d.ok) throw new Error(d.error||'erro');
    statusEl.className='action-status ok'; statusEl.textContent='Guardado! Já aparece no site.';
    await loadCatalog();
    activeCatId = d.id;
    renderCatalogList();
  } catch(err){
    statusEl.className='action-status err'; statusEl.textContent='Falhou: '+err.message;
  } finally {
    saveBtn.disabled = false;
  }
}

async function toggleRoute(id, currentlyActive){
  const btn = document.getElementById('btn-toggle');
  btn.disabled = true;
  try {
    const res = await fetch(withAuth(API.toggle), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, active: !currentlyActive})
    });
    const d = await res.json();
    if(!res.ok||!d.ok) throw new Error(d.error||'erro');
    await loadCatalog();
    // Reabrir para atualizar o estado no detalhe
    openCatalogRoute(id);
  } catch(err){
    alert('Erro: '+err.message);
    btn.disabled = false;
  }
}
</script>
