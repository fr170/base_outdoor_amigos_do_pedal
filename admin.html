<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Base Outdoor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{
    --pine:#131f17; --forest:#1e3225; --orange:#e35f21; --orange-2:#ff7a3d;
    --olive:#8a9a5b; --cream:#f3ede0; --paper:#faf7ee; --ink:#12160f;
    --mist:#c9d3bf; --line:rgba(243,237,224,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream); color:var(--ink); font-family:'Work Sans', sans-serif;
    font-size:15px; line-height:1.6; min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.03em;}
  h1,h2,h3{font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.01em;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  /* ---- Gate de password ---- */
  #gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 20% 0%, #1a2c1f 0%, var(--pine) 55%, #0d1610 100%);
    color:var(--paper); padding:24px;
  }
  #gate .box{max-width:360px; width:100%; text-align:center;}
  #gate h1{font-size:28px; color:var(--paper); margin-bottom:8px;}
  #gate p{color:var(--mist); font-size:14px; margin-bottom:26px;}
  #gate input{
    width:100%; padding:13px 14px; border-radius:3px; border:1px solid rgba(243,237,224,0.25);
    background:rgba(255,255,255,0.06); color:var(--paper); font-size:15px; margin-bottom:14px;
  }
  #gate input:focus{outline:none; border-color:var(--orange);}
  #gate button{
    width:100%; padding:13px; border:0; border-radius:3px; background:var(--orange);
    color:var(--pine); font-weight:600; font-family:'IBM Plex Mono', monospace;
    font-size:13px; letter-spacing:0.06em; text-transform:uppercase; transition:background .2s ease;
  }
  #gate button:hover{background:var(--orange-2);}
  #gate .err{color:var(--orange-2); font-size:13px; margin-top:14px; min-height:16px;}

  /* ---- App ---- */
  #app{display:none;}
  header{
    background:var(--pine); color:var(--paper); padding:20px 28px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  header .brand{font-family:'Anton', sans-serif; text-transform:uppercase; font-size:18px;}
  header .brand span{color:var(--orange);}
  header .actions{display:flex; align-items:center; gap:16px;}
  .toggle-all{display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--mist);}
  .logout{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--mist);
    border:1px solid var(--line); padding:8px 14px; border-radius:2px; background:none;
  }
  .logout:hover{color:var(--paper); border-color:var(--orange);}

  main{max-width:1300px; margin:0 auto; padding:28px;}
  .layout{
    display:grid; grid-template-columns:320px 1fr; gap:0;
    background:var(--forest); border:1px solid var(--line); border-radius:6px; overflow:hidden;
    min-height:600px;
  }
  .list-wrap{border-right:1px solid var(--line); max-height:80vh; overflow-y:auto;}
  .list-empty{padding:26px 22px; font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:#7c8f77;}
  ul.sub-list{list-style:none;}
  .sub-item{
    padding:16px 20px; border-bottom:1px solid var(--line); cursor:pointer; position:relative;
    transition:background .2s ease;
  }
  .sub-item::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--orange); transform:scaleY(0); transition:transform .2s ease;
  }
  .sub-item:hover{background:rgba(227,95,33,0.06);}
  .sub-item.active{background:rgba(227,95,33,0.1);}
  .sub-item.active::before{transform:scaleY(1);}
  .sub-item .name{font-family:'Anton', sans-serif; font-size:16px; text-transform:uppercase; color:var(--paper);}
  .sub-item .meta{display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--mist); margin-top:5px;}
  .status-pill{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.06em;
    text-transform:uppercase; padding:3px 8px; border-radius:20px; margin-top:6px;
  }
  .status-pendente{background:rgba(227,95,33,0.18); color:var(--orange-2);}
  .status-aprovado{background:rgba(138,154,91,0.2); color:var(--olive);}
  .status-rejeitado{background:rgba(201,211,191,0.12); color:var(--mist);}

  .detail{padding:28px 32px;}
  .detail-empty{
    height:100%; display:flex; align-items:center; justify-content:center;
    color:#7c8f77; font-family:'IBM Plex Mono', monospace; font-size:13px; min-height:500px; text-align:center;
  }
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .detail-head h2{font-size:26px; color:var(--paper);}
  .submitter{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--mist); margin-bottom:20px;}
  .submitter a{color:var(--orange-2);}

  #admin-map{
    position:relative; height:340px; border-radius:4px; overflow:hidden; background:var(--pine); margin-bottom:24px;
  }
  #admin-map-el{position:absolute; inset:0; width:100%; height:100%;}
  .map-msg{
    position:absolute; left:0; right:0; bottom:0; z-index:600; padding:12px 18px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--paper);
    background:linear-gradient(to top, rgba(10,17,12,0.9), rgba(10,17,12,0));
  }
  .stats-row{display:flex; gap:26px; margin-bottom:24px; flex-wrap:wrap;}
  .stats-row div{display:flex; flex-direction:column; gap:3px;}
  .stats-row .val{font-family:'IBM Plex Mono', monospace; font-size:17px; color:var(--paper);}
  .stats-row .lbl{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--olive);}

  .edit-form{background:var(--paper); border-radius:6px; padding:26px;}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:18px;}
  .field label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink);}
  .field input, .field select, .field textarea{
    font-family:'Work Sans', sans-serif; font-size:14.5px; color:var(--ink);
    background:#fff; border:1px solid #d8d0ba; border-radius:3px; padding:10px 12px; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--orange);}
  .field textarea{resize:vertical;}
  .field-file{font-family:'IBM Plex Mono', monospace; font-size:12px; color:#5a6152;}
  .range-row{display:flex; align-items:center; gap:12px;}
  .range-row input[type="range"]{flex:1;}
  .range-row .range-val{font-family:'IBM Plex Mono', monospace; font-size:13px; width:34px; text-align:right;}

  .action-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; align-items:center;}
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.06em; text-transform:uppercase;
    padding:13px 22px; border-radius:2px; border:1px solid transparent; transition:transform .15s ease, background .2s ease;
  }
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn-approve{background:var(--orange); color:var(--pine); font-weight:600;}
  .btn-approve:hover:not(:disabled){background:var(--orange-2); transform:translateY(-1px);}
  .btn-reject{background:none; border-color:#c94b3f; color:#c94b3f;}
  .btn-reject:hover:not(:disabled){background:#c94b3f; color:#fff;}
  .action-status{font-family:'IBM Plex Mono', monospace; font-size:12.5px;}
  .action-status.ok{color:#4b7a3d;}
  .action-status.err{color:var(--orange);}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .list-wrap{border-right:0; border-bottom:1px solid var(--line); max-height:280px;}
    .form-row{grid-template-columns:1fr;}
    .detail{padding:22px 18px;}
  }
</style>
</head>
<body>

<!-- ===== Gate de password ===== -->
<div id="gate">
  <div class="box">
    <h1>Base Outdoor</h1>
    <p class="mono">Área de administração — revisão de rotas submetidas</p>
    <input type="password" id="gate-password" placeholder="Password de administrador" autocomplete="current-password">
    <button id="gate-submit">Entrar</button>
    <p class="err mono" id="gate-error"></p>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app">
  <header>
    <div class="brand">BASE OUTDOOR <span>ADMIN</span></div>
    <div class="actions">
      <label class="toggle-all"><input type="checkbox" id="toggle-all"> mostrar aprovadas/rejeitadas</label>
      <button class="logout" id="logout-btn">Sair</button>
    </div>
  </header>

  <main>
    <div class="layout">
      <div class="list-wrap">
        <ul class="sub-list" id="sub-list"></ul>
        <p class="list-empty" id="list-empty" hidden>Sem submissões pendentes. 🎉</p>
      </div>

      <div class="detail" id="detail">
        <div class="detail-empty">Seleciona uma submissão à esquerda para reveres o traçado e os detalhes.</div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  const API = {
    list: '/.netlify/functions/admin-list-submissions',
    get: '/.netlify/functions/admin-get-submission',
    approve: '/.netlify/functions/admin-approve-submission',
    reject: '/.netlify/functions/admin-reject-submission'
  };

  let adminPassword = sessionStorage.getItem('baseOutdoorAdminPw') || '';
  let submissions = [];
  let activeKey = null;
  let activeGpxPoints = [];
  let replacementFile = null;

  // Passa a password como query param em vez de header — mais fiável em
  // todos os browsers sem risco de o preflight CORS a rejeitar.
  function withAuth(url){
    const u = new URL(url, location.origin);
    u.searchParams.set('pw', adminPassword);
    return u.toString();
  }
  function authHeaders(){ return {}; } // mantido para não partir chamadas existentes

  // ---- Gate ----
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const gatePwInput = document.getElementById('gate-password');
  const gateError = document.getElementById('gate-error');

  async function tryEnter(pw){
    gateError.textContent = '';
    try {
      const u = new URL(API.list, location.origin); u.searchParams.set('pw', pw);
      const res = await fetch(u.toString());
      if (res.status === 401){
        gateError.textContent = 'Password incorreta.';
        return false;
      }
      if (!res.ok){
        gateError.textContent = 'Erro ao ligar ao servidor (' + res.status + '). Tenta novamente.';
        return false;
      }
      adminPassword = pw;
      sessionStorage.setItem('baseOutdoorAdminPw', pw);
      gate.style.display = 'none';
      app.style.display = 'block';
      loadList();
      return true;
    } catch (err){
      console.error(err);
      gateError.textContent = 'Não foi possível ligar ao servidor.';
      return false;
    }
  }

  document.getElementById('gate-submit').addEventListener('click', () => tryEnter(gatePwInput.value));
  gatePwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(gatePwInput.value); });
  document.getElementById('logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('baseOutdoorAdminPw');
    location.reload();
  });

  if (adminPassword) tryEnter(adminPassword);

  // ---- Lista ----
  const subListEl = document.getElementById('sub-list');
  const listEmptyEl = document.getElementById('list-empty');
  const toggleAll = document.getElementById('toggle-all');

  async function loadList(){
    subListEl.innerHTML = '';
    try {
      const baseUrl = API.list + (toggleAll.checked ? '?all=1' : '');
      const res = await fetch(withAuth(baseUrl));
      if (res.status === 401){ sessionStorage.removeItem('baseOutdoorAdminPw'); location.reload(); return; }
      const data = await res.json();
      submissions = (data.submissions || []);
      renderList();
    } catch (err){
      console.error('[admin] Falha ao carregar lista:', err);
      listEmptyEl.hidden = false;
      listEmptyEl.textContent = 'Erro ao carregar submissões.';
    }
  }
  toggleAll.addEventListener('change', loadList);

  function renderList(){
    subListEl.innerHTML = '';
    listEmptyEl.hidden = submissions.length !== 0;
    submissions.forEach(s => {
      const li = document.createElement('li');
      li.className = 'sub-item' + (s.key === activeKey ? ' active' : '');
      const status = s.status || 'pendente';
      const date = s.submittedAt ? new Date(s.submittedAt).toLocaleDateString('pt-PT') : '';
      li.innerHTML = `
        <span class="name">${escapeHtml(s.nomeRota || '(sem nome)')}</span>
        <span class="meta">${escapeHtml(s.nome || '?')} · ${date}</span>
        <span class="status-pill status-${status}">${status}</span>
      `;
      li.addEventListener('click', () => openSubmission(s.key));
      subListEl.appendChild(li);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  // ---- Detalhe / mapa / edição ----
  const detailEl = document.getElementById('detail');
  let leafletMap, trackLayer;

  async function openSubmission(key){
    activeKey = key;
    replacementFile = null;
    renderList();

    detailEl.innerHTML = '<div class="detail-empty">A carregar…</div>';
    try {
      const res = await fetch(withAuth(API.get + '?key=' + encodeURIComponent(key)));
      if (res.status === 401){ sessionStorage.removeItem('baseOutdoorAdminPw'); location.reload(); return; }
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'erro');
      renderDetail(data.key, data.info, data.gpx);
    } catch (err){
      console.error('[admin] Falha ao carregar submissão:', err);
      detailEl.innerHTML = '<div class="detail-empty">Não foi possível carregar esta submissão.</div>';
    }
  }

  function extractGpxPoints(xml){
    let nodes = Array.from(xml.querySelectorAll('trkpt, rtept'));
    if (nodes.length === 0){
      for (const ns of ['http://www.topografix.com/GPX/1/1', 'http://www.topografix.com/GPX/1/0']){
        const trk = Array.from(xml.getElementsByTagNameNS(ns, 'trkpt'));
        const rte = Array.from(xml.getElementsByTagNameNS(ns, 'rtept'));
        if (trk.length || rte.length){ nodes = trk.concat(rte); break; }
      }
    }
    if (nodes.length === 0){
      nodes = Array.from(xml.getElementsByTagName('*')).filter(el => el.localName === 'trkpt' || el.localName === 'rtept');
    }
    return nodes.map(pt => {
      const eleEl = Array.from(pt.getElementsByTagName('*')).find(c => c.localName === 'ele');
      return {
        lat: parseFloat(pt.getAttribute('lat')),
        lon: parseFloat(pt.getAttribute('lon')),
        ele: eleEl ? parseFloat(eleEl.textContent) : null
      };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
  }

  function haversineMeters(lat1, lon1, lat2, lon2){
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function computeStats(points){
    let distM = 0, gain = 0;
    for (let i = 1; i < points.length; i++){
      distM += haversineMeters(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
      if (points[i].ele != null && points[i-1].ele != null){
        const d = points[i].ele - points[i-1].ele;
        if (d > 0) gain += d;
      }
    }
    return { distanceKm: distM / 1000, elevationGain: Math.round(gain) };
  }

  function renderDetail(key, info, gpxText){
    detailEl.innerHTML = `
      <div class="detail-head">
        <h2>${escapeHtml(info.nomeRota || 'Rota sem nome')}</h2>
      </div>
      <p class="submitter">Submetido por ${escapeHtml(info.nome || '?')} · <a href="mailto:${escapeHtml(info.email || '')}">${escapeHtml(info.email || '')}</a>
        ${info.submittedAt ? ' · ' + new Date(info.submittedAt).toLocaleString('pt-PT') : ''}
        ${info.status ? ' · estado atual: <strong>' + escapeHtml(info.status) + '</strong>' : ''}
      </p>

      <div id="admin-map"><div id="admin-map-el"></div><div class="map-msg" id="admin-map-msg" hidden></div></div>

      <div class="stats-row" id="admin-stats">
        <div><span class="val mono" id="stat-dist">—</span><span class="lbl">distância (calculada)</span></div>
        <div><span class="val mono" id="stat-elev">—</span><span class="lbl">D+ (calculado)</span></div>
        <div><span class="val mono" id="stat-pts">—</span><span class="lbl">pontos no track</span></div>
      </div>

      <div class="edit-form">
        <div class="form-row">
          <div class="field">
            <label for="f-name">Nome da rota</label>
            <input type="text" id="f-name" value="${escapeHtml(info.nomeRota || '')}">
          </div>
          <div class="field">
            <label for="f-category">Categoria</label>
            <select id="f-category">
              <option value="btt">BTT</option>
              <option value="estrada">Estrada</option>
              <option value="trail">Trail</option>
              <option value="cross">Cross</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-description">Descrição pública</label>
          <textarea id="f-description" rows="3" placeholder="Descrição que vai aparecer no site...">${escapeHtml(info.notas || '')}</textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="f-distance">Distância (texto a mostrar)</label>
            <input type="text" id="f-distance" placeholder="ex: 32.4 km">
          </div>
          <div class="field">
            <label for="f-elevation">D+ (texto a mostrar)</label>
            <input type="text" id="f-elevation" placeholder="ex: 640 m">
          </div>
        </div>
        <div class="field">
          <label>Dificuldade</label>
          <div class="range-row">
            <input type="range" id="f-diff" min="0" max="100" value="50">
            <span class="range-val mono" id="f-diff-val">50</span>
          </div>
        </div>
        <div class="field">
          <label for="f-gpxfile">Substituir ficheiro GPX <span style="text-transform:none; color:#9a9584;">(opcional)</span></label>
          <input type="file" id="f-gpxfile" accept=".gpx" class="field-file">
        </div>

        <div class="action-row">
          <button class="btn btn-approve" id="btn-approve">Aprovar e publicar</button>
          <button class="btn btn-reject" id="btn-reject">Rejeitar</button>
          <span class="action-status mono" id="action-status"></span>
        </div>
      </div>
    `;

    document.getElementById('f-category').value = info.categoria || 'btt';
    document.getElementById('f-diff').addEventListener('input', (e) => {
      document.getElementById('f-diff-val').textContent = e.target.value;
    });
    document.getElementById('f-gpxfile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      replacementFile = file;
      const reader = new FileReader();
      reader.onload = () => renderMapFromGpxText(reader.result, true);
      reader.readAsText(file);
    });
    document.getElementById('btn-approve').addEventListener('click', () => submitDecision(key, 'approve'));
    document.getElementById('btn-reject').addEventListener('click', () => submitDecision(key, 'reject'));

    renderMapFromGpxText(gpxText, false);
  }

  function renderMapFromGpxText(gpxText, isReplacement){
    const msgEl = document.getElementById('admin-map-msg');
    msgEl.hidden = true;

    let points = [];
    try {
      const xml = new DOMParser().parseFromString(gpxText, 'application/xml');
      if (!xml.querySelector('parsererror')) points = extractGpxPoints(xml);
    } catch (err){
      console.error('[admin] Erro a interpretar GPX:', err);
    }
    activeGpxPoints = points;

    if (!leafletMap){
      leafletMap = L.map('admin-map-el', { zoomControl: true, scrollWheelZoom: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);
    }
    if (trackLayer){ leafletMap.removeLayer(trackLayer); trackLayer = null; }

    if (points.length < 2){
      leafletMap.setView([40.2500, -7.5500], 11);
      msgEl.hidden = false;
      msgEl.textContent = isReplacement
        ? 'Não encontrei pontos de traçado neste novo ficheiro.'
        : 'Este GPX não tem pontos de traçado.';
      document.getElementById('stat-dist').textContent = '—';
      document.getElementById('stat-elev').textContent = '—';
      document.getElementById('stat-pts').textContent = '0';
      setTimeout(() => leafletMap.invalidateSize(), 50);
      return;
    }

    const latlngs = points.map(p => [p.lat, p.lon]);
    trackLayer = L.polyline(latlngs, { color: '#ff7a3d', weight: 4, opacity: 0.95 }).addTo(leafletMap);
    setTimeout(() => {
      leafletMap.invalidateSize();
      leafletMap.fitBounds(trackLayer.getBounds(), { padding: [24, 24] });
    }, 60);

    const stats = computeStats(points);
    document.getElementById('stat-dist').textContent = stats.distanceKm.toFixed(1) + ' km';
    document.getElementById('stat-elev').textContent = Math.round(stats.elevationGain) + ' m';
    document.getElementById('stat-pts').textContent = points.length;

    // Pré-preenche os campos de texto só se ainda estiverem vazios.
    const distField = document.getElementById('f-distance');
    const elevField = document.getElementById('f-elevation');
    if (isReplacement || !distField.value) distField.value = stats.distanceKm.toFixed(1) + ' km';
    if (isReplacement || !elevField.value) elevField.value = Math.round(stats.elevationGain) + ' m';
  }

  async function submitDecision(key, action){
    const statusEl = document.getElementById('action-status');
    const approveBtn = document.getElementById('btn-approve');
    const rejectBtn = document.getElementById('btn-reject');

    if (action === 'reject'){
      if (!confirm('Rejeitar esta submissão?')) return;
      approveBtn.disabled = true; rejectBtn.disabled = true;
      statusEl.className = 'action-status mono';
      statusEl.textContent = 'A processar…';
      try {
        const res = await fetch(withAuth(API.reject), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'erro');
        statusEl.className = 'action-status mono ok';
        statusEl.textContent = 'Rejeitada.';
        await loadList();
        detailEl.innerHTML = '<div class="detail-empty">Seleciona uma submissão à esquerda.</div>';
      } catch (err){
        console.error(err);
        statusEl.className = 'action-status mono err';
        statusEl.textContent = 'Falhou: ' + err.message;
        approveBtn.disabled = false; rejectBtn.disabled = false;
      }
      return;
    }

    // approve
    const name = document.getElementById('f-name').value.trim();
    const category = document.getElementById('f-category').value;
    const description = document.getElementById('f-description').value.trim();
    const distance = document.getElementById('f-distance').value.trim();
    const elevation = document.getElementById('f-elevation').value.trim();
    const diff = document.getElementById('f-diff').value;

    if (!name){
      statusEl.className = 'action-status mono err';
      statusEl.textContent = 'Dá um nome à rota antes de aprovar.';
      return;
    }

    approveBtn.disabled = true; rejectBtn.disabled = true;
    statusEl.className = 'action-status mono';
    statusEl.textContent = 'A publicar…';

    const formData = new FormData();
    formData.set('key', key);
    formData.set('name', name);
    formData.set('category', category);
    formData.set('description', description);
    formData.set('distance', distance);
    formData.set('elevation', elevation);
    formData.set('diff', diff);
    if (replacementFile) formData.set('gpxFile', replacementFile);

    try {
      const res = await fetch(withAuth(API.approve), { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'erro');
      statusEl.className = 'action-status mono ok';
      statusEl.textContent = 'Publicada! Já aparece no site.';
      await loadList();
      detailEl.innerHTML = '<div class="detail-empty">Seleciona uma submissão à esquerda.</div>';
    } catch (err){
      console.error(err);
      statusEl.className = 'action-status mono err';
      statusEl.textContent = 'Falhou: ' + err.message;
      approveBtn.disabled = false; rejectBtn.disabled = false;
    }
  }
</script>
